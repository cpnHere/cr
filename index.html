<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── theme tokens ── */
  :root[data-theme="dark"] {
    --bg:           #0f0e17;
    --surface:      #1a1826;
    --card:         #211f30;
    --border:       #2e2b42;
    --accent:       #ff6b35;
    --accent2:      #f7c59f;
    --gold:         #e8c97e;
    --text:         #fffffe;
    --muted:        #a7a5b8;
    --chord-col:    #ff6b35;
    --lyric-col:    #fffffe;
    --hover-row:    #272438;
    --selected-row: #2a2042;
    --th-color:     #a7a5b8;
    --toggle-bg:    #2e2b42;
  }
  :root[data-theme="light"] {
    --bg:           #f5f3ee;
    --surface:      #ffffff;
    --card:         #ece9e1;
    --border:       #d8d4c8;
    --accent:       #c94a1a;
    --accent2:      #9c3a10;
    --gold:         #8a6800;
    --text:         #1a1714;
    --muted:        #6b6560;
    --chord-col:    #c94a1a;
    --lyric-col:    #1a1714;
    --hover-row:    #ede9e0;
    --selected-row: #f5ddd4;
    --th-color:     #6b6560;
    --toggle-bg:    #d8d4c8;
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  #app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ── header ── */
  header {
    padding: 1.3rem 1.8rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    transition: background 0.3s, border-color 0.3s;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    color: var(--text);
    line-height: 1;
  }
  .logo span { color: var(--accent); }

  .tagline {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 0.25rem;
  }

  /* ── header right ── */
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  #search {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    padding: 0.42rem 0.85rem;
    outline: none;
    width: clamp(120px, 20vw, 230px);
    transition: border-color 0.2s, background 0.3s, color 0.3s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  /* ── theme toggle pill ── */
  #theme-btn {
    background: var(--toggle-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    width: 3rem;
    height: 1.6rem;
    display: flex;
    align-items: center;
    padding: 0 0.22rem;
    flex-shrink: 0;
    position: relative;
    transition: background 0.3s, border-color 0.2s;
  }
  #theme-btn:hover { border-color: var(--accent); }

  .theme-thumb {
    width: 1.15rem;
    height: 1.15rem;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    line-height: 1;
    transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"]  .theme-thumb { transform: translateX(0); }
  [data-theme="light"] .theme-thumb { transform: translateX(1.35rem); }

  .theme-label {
    position: absolute;
    font-size: 0.5rem;
    color: var(--muted);
    pointer-events: none;
  }
  [data-theme="dark"]  .theme-label { right: 0.28rem; }
  [data-theme="light"] .theme-label { left: 0.28rem; }

  /* ── layout ── */
  main { display: flex; flex: 1; overflow: hidden; }

  #list-panel {
    width: 100%;
    max-width: 820px;
    overflow-y: auto;
    padding: 1.3rem 1.4rem 3rem;
  }

  /* ── table ── */
  .song-count {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }

  thead th {
    text-align: left;
    padding: 0.5rem 0.75rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.67rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--th-color);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color 0.2s;
  }
  thead th:hover { color: var(--accent2); }
  thead th .sort-icon { margin-left: 0.3em; opacity: 0.4; font-size: 0.6rem; }
  thead th.active { color: var(--gold); }
  thead th.active .sort-icon { opacity: 1; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;
  }
  tbody tr:hover { background: var(--hover-row); }
  tbody tr.selected { background: var(--selected-row); }
  tbody tr.selected td:first-child {
    border-left: 3px solid var(--accent);
    padding-left: calc(0.75rem - 3px);
  }

  td { padding: 0.65rem 0.75rem; vertical-align: middle; }
  td.title-cell {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.96rem;
    color: var(--text);
  }
  td.meta-cell { color: var(--muted); font-size: 0.82rem; }

  .no-results {
    color: var(--muted);
    font-size: 0.88rem;
    padding: 2rem 0;
    text-align: center;
  }

  /* ── chord sheet panel ── */
  #sheet-panel {
    display: none;
    flex: 1;
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 2rem 2rem 4rem;
    background: var(--surface);
    position: relative;
    transition: background 0.3s, border-color 0.3s;
  }
  #sheet-panel.open { display: block; }

  .sheet-header {
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .sheet-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 900;
    color: var(--text);
    line-height: 1.15;
  }
  .sheet-meta {
    margin-top: 0.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1rem;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .sheet-meta span { display: flex; gap: 0.3em; align-items: center; }
  .sheet-meta strong { color: var(--accent2); font-weight: 500; }

  #close-btn {
    position: absolute;
    top: 1.2rem;
    right: 1.2rem;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 50%;
    width: 1.9rem;
    height: 1.9rem;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s, border-color 0.2s, background 0.3s;
  }
  #close-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ── chord sheet content ── */
  .sheet-body { line-height: 1; }

  .line {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    margin-bottom: 0.2rem;
    min-height: 2.9em;
  }
  .cell { display: inline-flex; flex-direction: column; align-items: flex-start; }

  .chord {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--chord-col);
    line-height: 1.35;
    white-space: pre;
    min-width: 1ch;
  }
  .lyric {
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    color: var(--lyric-col);
    white-space: pre;
    line-height: 1.5;
  }
  .lyric-plain {
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    color: var(--lyric-col);
    line-height: 2.3;
  }
  .prefix {
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    color: var(--muted);
    align-self: flex-end;
    line-height: 1.5;
  }

  /* ── mobile ── */
  @media (max-width: 680px) {
    main { position: relative; }
    #list-panel { max-width: 100%; padding: 1rem 0.8rem 3rem; }
    #sheet-panel {
      position: fixed;
      inset: 0;
      z-index: 100;
      border-left: none;
      padding: 1.2rem 1rem 4rem;
      overflow-y: auto;
    }
    #close-btn { top: 0.8rem; right: 0.8rem; }
    td.meta-cell { display: none; }
    thead th.hide-mobile { display: none; }
  }

  /* ── scrollbar ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <div class="logo">C<span>R</span></div>
      <div class="tagline">Guitar Chord Reference</div>
    </div>
    <div class="header-right">
      <input id="search" type="search" placeholder="Search…" oninput="filterSongs()">
      <button id="theme-btn" onclick="toggleTheme()" title="Toggle dark / light theme" aria-label="Toggle theme">
        <div class="theme-thumb" id="theme-thumb"></div>
        <span class="theme-label" id="theme-label"></span>
      </button>
    </div>
  </header>

  <main>
    <div id="list-panel">
      <div class="song-count" id="song-count"></div>
      <table>
        <thead>
          <tr>
            <th onclick="sortBy(0)" class="active" data-col="0">Title <span class="sort-icon">▲</span></th>
            <th onclick="sortBy(1)" data-col="1" class="hide-mobile">Composer <span class="sort-icon">⇅</span></th>
            <th onclick="sortBy(2)" data-col="2" class="hide-mobile">Lyricist <span class="sort-icon">⇅</span></th>
            <th onclick="sortBy(3)" data-col="3" class="hide-mobile">Singer <span class="sort-icon">⇅</span></th>
          </tr>
        </thead>
        <tbody id="song-tbody"></tbody>
      </table>
      <div class="no-results" id="no-results" style="display:none">No songs found.</div>
    </div>

    <div id="sheet-panel">
      <button id="close-btn" onclick="closeSheet()">✕</button>
      <div class="sheet-header">
        <div class="sheet-title" id="sheet-title"></div>
        <div class="sheet-meta"  id="sheet-meta"></div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </main>

</div>

  }

let sortCol = 0, sortAsc = true, filterText = "", selectedIdx = null;

/* ── theme ── */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const thumb = document.getElementById("theme-thumb");
  const label = document.getElementById("theme-label");
  thumb.textContent = theme === "dark" ? "☀" : "🌙";
  label.textContent = theme === "dark" ? "☾" : "☀";
}
function toggleTheme() {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  localStorage.setItem("cr-theme", next);
  applyTheme(next);
}
applyTheme(localStorage.getItem("cr-theme") || "dark");

/* ── table ── */
function getDisplay() {
  return SONGS
    .map((s, i) => ({...s, _orig: i}))
    .filter(s => {
      if (!filterText) return true;
      return (s.title + s.composer + s.lyricist + s.singer)
        .toLowerCase().includes(filterText.toLowerCase());
    })
    .sort((a, b) => {
      const k = ["title","composer","lyricist","singer"][sortCol];
      return sortAsc ? a[k].localeCompare(b[k]) : b[k].localeCompare(a[k]);
    });
}

function renderTable() {
  const rows  = getDisplay();
  const tbody = document.getElementById("song-tbody");
  tbody.innerHTML = "";
  rows.forEach(s => {
    const tr = document.createElement("tr");
    if (s._orig === selectedIdx) tr.classList.add("selected");
    tr.innerHTML =
      `<td class="title-cell">${esc(s.title)}</td>` +
      `<td class="meta-cell">${esc(s.composer)}</td>` +
      `<td class="meta-cell">${esc(s.lyricist)}</td>` +
      `<td class="meta-cell">${esc(s.singer)}</td>`;
    tr.onclick = () => openSheet(s._orig);
    tbody.appendChild(tr);
  });
  const n = rows.length;
  document.getElementById("song-count").textContent = n + " song" + (n !== 1 ? "s" : "");
  document.getElementById("no-results").style.display = n ? "none" : "block";
}

function sortBy(col) {
  sortCol === col ? (sortAsc = !sortAsc) : (sortCol = col, sortAsc = true);
  document.querySelectorAll("thead th").forEach(th => {
    const c = +th.dataset.col;
    th.classList.toggle("active", c === sortCol);
    th.querySelector(".sort-icon").textContent =
      c === sortCol ? (sortAsc ? "▲" : "▼") : "⇅";
  });
  renderTable();
}

function filterSongs() {
  filterText = document.getElementById("search").value;
  renderTable();
}

function openSheet(idx) {
  selectedIdx = idx;
  renderTable();
  const s = SONGS[idx];
  document.getElementById("sheet-title").textContent = s.title;
  document.getElementById("sheet-meta").innerHTML =
    `<span><strong>Composer</strong> ${esc(s.composer)}</span>` +
    `<span><strong>Lyricist</strong> ${esc(s.lyricist)}</span>` +
    `<span><strong>Singer</strong>   ${esc(s.singer)}</span>`;
  document.getElementById("sheet-body").innerHTML = s.sections.join("\n");
  const panel = document.getElementById("sheet-panel");
  panel.classList.add("open");
  panel.scrollTop = 0;
}

function closeSheet() {
  selectedIdx = null;
  document.getElementById("sheet-panel").classList.remove("open");
  renderTable();
}

function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

renderTable();
</script>
